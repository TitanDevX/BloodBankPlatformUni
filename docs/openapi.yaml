openapi: 3.0.3
info:
  title: Blood Bank Platform API
  version: 1.0.0
  description: |
    Implemented HTTP endpoints in the Laravel backend. This document describes
    the live Identity API and framework health route. Other operations in
    BACKEND_API_REFERENCE.md are proposed and are not available yet.
servers:
  - url: /
    description: Current server
tags:
  - name: Sessions
    description: Staff authentication with expiring bearer tokens.
  - name: Users
    description: The authenticated staff account and administrator-managed users.
  - name: Roles
    description: Read-only staff roles and their required organization scope.
  - name: Health
    description: Framework liveness check.
paths:
  /v1/sessions:
    post:
      tags: [Sessions]
      summary: Create a session
      description: |
        Authenticate an active staff account. The access token appears only in
        this response. Invalid credentials and inactive accounts have the same
        response. Login is limited to five attempts per minute per email and IP.
      operationId: createSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreateRequest'
            example:
              email: admin@demo.com
              password: '123456'
              deviceDisplayName: Admin browser
      responses:
        '200':
          description: Session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCreateResponse'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          description: Invalid credentials or inactive account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: 401
                  message: Invalid email or password.
                  status: UNAUTHENTICATED
                  details:
                    - '@type': type.googleapis.com/google.rpc.ErrorInfo
                      reason: INVALID_CREDENTIALS
                      domain: localhost
        '429':
          description: Too many login attempts. Retry after the rate limit resets.
          headers:
            Retry-After:
              description: Seconds until another attempt can be made.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/sessions/current:
    delete:
      tags: [Sessions]
      summary: End the current session
      description: Revokes only the bearer token used for this request.
      operationId: deleteCurrentSession
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Session ended. The response body is empty.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InactiveAccount'
  /v1/users/me:
    get:
      tags: [Users]
      summary: Get the current user
      description: Returns the active account associated with the bearer token.
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InactiveAccount'
  /v1/roles:
    get:
      tags: [Roles]
      summary: List assignable roles
      description: Administrator only. Roles are seeded definitions and cannot be edited through this API.
      operationId: listRoles
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All roles.
          content:
            application/json:
              schema:
                type: object
                required: [roles, nextPageToken]
                properties:
                  roles:
                    type: array
                    items:
                      $ref: '#/components/schemas/Role'
                  nextPageToken:
                    type: string
                    enum: ['']
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/users:
    get:
      tags: [Users]
      summary: List users
      description: Administrator only. Results are ordered by user ID descending.
      operationId: listUsers
      security:
        - bearerAuth: []
      parameters:
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 100
            default: 25
        - name: pageToken
          in: query
          schema:
            type: string
          description: Opaque cursor from the previous page.
        - name: search
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 100
          description: Case-insensitive display-name substring.
        - name: active
          in: query
          schema:
            type: boolean
        - name: role
          in: query
          schema:
            type: string
          description: Role resource name, such as roles/bank_admin.
      responses:
        '200':
          description: User page.
          content:
            application/json:
              schema:
                type: object
                required: [users, nextPageToken]
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  nextPageToken:
                    type: string
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Users]
      summary: Create a user
      description: Administrator only. Initial password is hashed and never returned.
      operationId: createUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '200':
          description: User created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/AlreadyExists'
  /v1/users/{user}:
    parameters:
      - name: user
        in: path
        required: true
        description: Numeric user ID from the canonical user name.
        schema:
          type: integer
    get:
      tags: [Users]
      summary: Get a user
      description: Administrator only.
      operationId: getUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: User not found.
    patch:
      tags: [Users]
      summary: Update a user's profile
      description: Administrator only. Only displayName and email may change here.
      operationId: updateUser
      security:
        - bearerAuth: []
      parameters:
        - name: updateMask
          in: query
          schema:
            type: string
          example: displayName,email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: User not found.
        '409':
          $ref: '#/components/responses/AlreadyExists'
  /v1/users/{user}:assignRole:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Users]
      summary: Assign a role and organization scope
      description: Administrator only. System roles have no organization; bank and hospital roles require exactly their own scope.
      operationId: assignUserRole
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleAssignmentRequest'
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: User not found.
  /v1/users/{user}:deactivate:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Users]
      summary: Deactivate a user
      description: Administrator only. Existing tokens are revoked. The last active administrator cannot be deactivated.
      operationId: deactivateUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusChangeRequest'
      responses:
        '200':
          description: Deactivated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: User not found.
  /v1/users/{user}:activate:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Users]
      summary: Reactivate a user
      description: Administrator only. The user must log in again after reactivation.
      operationId: activateUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: User not found.
  /up:
    get:
      tags: [Health]
      summary: Check application liveness
      description: Laravel's framework health route, outside the `/v1` API contract.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Application is running.
components:
  parameters:
    UserId:
      name: user
      in: path
      required: true
      description: Numeric user ID from the canonical user name.
      schema:
        type: integer
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum token
      description: Enter the accessToken returned by POST /v1/sessions.
  responses:
    InvalidArgument:
      description: The request has invalid fields.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthenticated:
      description: A valid bearer token is required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InactiveAccount:
      description: This account was deactivated after its token was issued.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Active administrator access is required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    AlreadyExists:
      description: Email address already belongs to a user.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    SessionCreateRequest:
      type: object
      additionalProperties: true
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          writeOnly: true
        deviceDisplayName:
          type: string
          minLength: 1
          maxLength: 100
          description: Optional name stored with the issued token.
    SessionCreateResponse:
      type: object
      additionalProperties: false
      required: [name, user, accessToken, tokenType, expireTime]
      properties:
        name:
          type: string
          description: Canonical session name.
          example: sessions/1
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string
          description: Plaintext token returned once; store securely.
        tokenType:
          type: string
          enum: [Bearer]
        expireTime:
          type: string
          format: date-time
          description: Token expiration time, currently twelve hours after login by default.
    User:
      type: object
      additionalProperties: false
      required: [name, displayName, email, role, bank, hospital, active, createTime, updateTime]
      properties:
        name:
          type: string
          description: Canonical user name, currently based on the numeric user ID.
          example: users/1
        displayName:
          type: string
          example: Nadia Saleh
        email:
          type: string
          format: email
          example: nadia@example.org
        role:
          type: string
          nullable: true
          example: roles/administrator
        bank:
          type: string
          nullable: true
          example: banks/demo-bank-damascus
        hospital:
          type: string
          nullable: true
          example: hospitals/demo-hospital-damascus
        active:
          type: boolean
          example: true
        createTime:
          type: string
          format: date-time
          nullable: true
        updateTime:
          type: string
          format: date-time
          nullable: true
    Role:
      type: object
      required: [name, code, displayName, scope]
      properties:
        name:
          type: string
          example: roles/bank_admin
        code:
          type: string
          example: bank_admin
        displayName:
          type: string
          example: Bank administrator
        scope:
          type: string
          enum: [SYSTEM, BANK, HOSPITAL]
    UserCreateRequest:
      type: object
      additionalProperties: false
      required: [displayName, email, initialPassword, role, active]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
        initialPassword:
          type: string
          format: password
          minLength: 12
          maxLength: 128
        role:
          type: string
          example: roles/bank_admin
        bank:
          type: string
          nullable: true
          example: banks/demo-bank-damascus
        hospital:
          type: string
          nullable: true
        active:
          type: boolean
    UserUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
    RoleAssignmentRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          type: string
          example: roles/hospital_requester
        bank:
          type: string
          nullable: true
        hospital:
          type: string
          nullable: true
          example: hospitals/demo-hospital-damascus
    StatusChangeRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    ApiError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, status, details]
          properties:
            code:
              type: integer
              example: 401
            message:
              type: string
            status:
              type: string
              example: UNAUTHENTICATED
            details:
              type: array
              items:
                type: object
                required: ['@type']
                properties:
                  '@type':
                    type: string
                  reason:
                    type: string
                  domain:
                    type: string
                  fieldViolations:
                    type: array
                    items:
                      type: object
                      required: [field, description]
                      properties:
                        field:
                          type: string
                        description:
                          type: string
